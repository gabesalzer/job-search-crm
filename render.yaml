# Render Blueprint — deploys the app as one always-on web service with a
# persistent disk for the SQLite database. Create the service by pointing
# Render at this repo ("New +" -> "Blueprint"). Set APP_PASSWORD and
# ANTHROPIC_API_KEY as secrets in the dashboard (intentionally not stored here —
# this repo is public, so anything with sync: false must never gain a value).
services:
  - type: web
    name: job-search-crm
    runtime: python
    plan: starter                      # always-on; required for a persistent disk
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /var/data             # SQLite DB lives here so it survives deploys
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/jobsearch.db   # four slashes = absolute path
      - key: APP_USERNAME
        value: gabe
      - key: APP_PASSWORD
        sync: false                    # set this yourself in the dashboard (secret)
      - key: ANTHROPIC_API_KEY
        sync: false                    # secret; powers the Brief panel. Unset = panel off, app still fine
      - key: BRIEF_MODEL
        value: claude-sonnet-5         # change here when this model ID is retired; no code change needed
      - key: PYTHON_VERSION
        value: "3.12.7"
